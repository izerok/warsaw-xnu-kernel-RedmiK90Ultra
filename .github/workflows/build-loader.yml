name: build-loader

# 只编 xnuloader（freestanding AArch64 UEFI app），不需要 Xcode / ptrauth / iig。
# Ubuntu 的 clang + lld-link 足够：--target=aarch64-unknown-windows + /nodefaultlib。
on:
  workflow_dispatch:
  push:
    paths:
      - 'xnuloader/**'
      - '.github/workflows/build-loader.yml'

# 产物要强推到 loader-artifacts 孤儿分支（见最后一步），所以要 contents: write。
permissions:
  contents: write

jobs:
  build-phone-loader:
    # 22.04 的 clang 14 编这个 target 会报 "fixup value out of range"；
    # 24.04 自带 clang 18，与 WSL 里成功编过的工具链一致。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装 clang 与 lld-link
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld
          clang --version | head -2
          command -v lld-link

      - name: 编 warsaw 专用 loader-phone.efi
        env:
          # WARSAW 让 PLAT_PHONE = &platform_warsaw，并把面板写死成 1280x2772
          EXTRA_CFLAGS: -DDIRECT_PHONE_PLAT -DWARSAW
          BUILD_ID: ${{ github.sha }}
        run: |
          cd xnuloader
          bash build.sh
          sha256sum loader-phone.efi
          ls -la loader-phone.efi

      - name: 确认产物是 AArch64 PE
        run: |
          python3 - <<'PY'
          import struct
          d = open('xnuloader/loader-phone.efi','rb').read()
          assert d[:2] == b'MZ', 'not a PE image'
          pe = struct.unpack('<I', d[0x3c:0x40])[0]
          assert d[pe:pe+4] == b'PE\0\0', 'no PE signature'
          machine = struct.unpack('<H', d[pe+4:pe+6])[0]
          print('PE machine = 0x%04x (0xaa64 = ARM64)' % machine)
          assert machine == 0xaa64
          print('size =', len(d))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: loader-phone-warsaw
          path: xnuloader/loader-phone.efi
          if-no-files-found: error

      # 与 build-kernel / build-mesa-air 同一模式：artifact 接口需要构建主机没有的
      # token，孤儿分支用 codeload / Contents API 就能取回。分支每轮强推替换，
      # 不累积历史。产物只有我们自己的 loader，不含任何 Apple 内容。
      - name: 把 loader 放到能长期取到的分支
        run: |
          set -euo pipefail
          O=/tmp/loader-out
          mkdir -p "$O"
          cp xnuloader/loader-phone.efi "$O/"
          (cd "$O" && sha256sum loader-phone.efi > loader-phone.sha256)
          ls -l "$O"
          cd "$O"
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b loader-artifacts
          git add -A
          git commit -qm "loader: ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin loader-artifacts
          echo "loader-artifacts: $(git rev-parse --short HEAD)"
