name: build host tools

# Two small host-side binaries that are needed to assemble the iOS 26 system
# image on a Windows build host. Neither job carries any Apple firmware or
# extracted iOS files: job 1 compiles our own LZBITMAP helper, job 2 compiles
# our own userland sources against Xcode's iPhoneOS SDK.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-host-tools.yml'
      - 'userland/src/**'

jobs:
  unzbm-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Build unzbm.exe
        run: |
          set -e
          cd xnu-deps/build/lzbitmap
          x86_64-w64-mingw32-gcc -O2 -static -Wall -o unzbm.exe unzbm.c libzbitmap.c
          ls -l unzbm.exe
          x86_64-w64-mingw32-objdump -f unzbm.exe | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: unzbm-windows
          path: xnu-deps/build/lzbitmap/unzbm.exe
          if-no-files-found: error

  arm64e-userland:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode_*.app || true
          sudo xcode-select -s /Applications/Xcode_26.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_26.2.app 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/checkout@v4
      - name: Fetch userland sources
        run: |
          git clone --depth 1 --branch k90-port https://github.com/iola1999/hackios-xnu-userland.git /tmp/u
          # The upstream tree splits src/ into apps/gfx/inject/services/boot/...; the sources
          # this workflow compiles live in this repository as userland/src (flat), so they are
          # laid over the clone and win. Without this the compile step looks for
          # src/input26_service.c, which upstream has at src/services/.
          cp -R userland/src/. /tmp/u/userland/src/
          ls /tmp/u/userland/src | head -40
      - name: Compile the arm64e programs
        run: |
          set -e
          cd /tmp/u/userland
          mkdir -p obj
          CC="/usr/bin/xcrun -sdk iphoneos clang -arch arm64e -miphoneos-version-min=26.0"
          $CC -Os -Wall -Wextra -framework CoreFoundation -framework IOKit \
              src/input26_service.c -o obj/input26-service
          /usr/bin/codesign --force --sign - --entitlements src/input26_service.entitlements obj/input26-service
          $CC -dynamiclib -install_name /redwood/lib/libredwood-sb26.dylib -Os -Wall -Wextra \
              -framework CoreFoundation -framework CoreGraphics -framework Metal \
              -lobjc -lMobileGestalt \
              src/inject_sb26.c src/inject_sb26_layers.c src/inject_sb26_rate.c src/inject_posterboard.c \
              -o obj/libredwood-sb26.dylib
          /usr/bin/codesign --force --sign - obj/libredwood-sb26.dylib
          $CC -dynamiclib -install_name /redwood/lib/libredwood-sbmetal-experiment.dylib \
              -Os -fno-objc-arc -Wall -Wextra \
              -framework Foundation -framework Metal -framework UIKit -framework IOKit -lobjc \
              src/sb_metal_experiment.m -o obj/libredwood-sbmetal-experiment.dylib
          /usr/bin/codesign --force --sign - obj/libredwood-sbmetal-experiment.dylib
          $CC -O1 -dynamiclib -install_name /redwood/lib/libredwoodmetal.dylib \
              -framework Foundation -framework IOKit -framework Metal -lobjc \
              src/redwoodmetal.m src/redwooddrawable.m -o obj/libredwoodmetal.dylib
          /usr/bin/codesign --force --sign - obj/libredwoodmetal.dylib
          # The same driver as a loadable bundle: Metal's discovery composes
          # /System/Library/Extensions/<MetalPluginName>.bundle and takes the class from it; a
          # dylib cannot serve, because dyld uniques images by install_name and the bundle would
          # bind to the copy the process already has.  build.sh assembles
          # root/lib/RedwoodMetal.bundle from obj/RedwoodMetal + src/metal_plugin.plist.
          $CC -bundle -framework Foundation -framework IOKit -framework Metal -lobjc \
              -o obj/RedwoodMetal src/redwoodmetal.m src/redwooddrawable.m
          /usr/bin/codesign --force --sign - obj/RedwoodMetal
          # rwsh: the host's remote hand on a device that has no shell.  "fastboot oem sh TEXT"
          # puts TEXT into the running kernel's mailbox (kern.redwood.cmd), rwsh runs it every
          # 250 ms and its output goes to the console log we already capture.  It links libnotify
          # for "notify NAME"; if the SDK's stub is not there, a dynamic lookup is enough.
          $CC -O2 -Wall -Wextra src/rwsh.c -o obj/rwsh -lnotify || \
            $CC -O2 -Wall -Wextra -Wl,-undefined,dynamic_lookup src/rwsh.c -o obj/rwsh
          # The Metal side.  metal_props is the switch: Metal finds a GPU only by
          # IOServiceMatching("IOAcceleratorES") + reading MetalPluginName off it, and this
          # port's service publishes without that property, so nothing in the system walks the
          # Metal road -- CoreImage then falls back to a software context, which in iOS 26
          # cannot do the 8bit working format iconservicesagent asks for, and icon artwork
          # comes out as zero bytes (black icons on a correct home screen).  The flags and
          # frameworks are upstream build.sh's, unchanged.
          $CC -O1 -framework CoreFoundation -framework IOKit -o obj/metal_props src/metal_props.c
          $CC -O1 -framework Foundation -framework IOKit -framework Metal -lobjc \
              -o obj/metal_dev src/metal_dev.m
          $CC -O1 -framework Foundation -framework IOKit -framework Metal -lobjc \
              -o obj/metal_drv_test src/metal_drv_test.m
          $CC -O1 -framework Foundation -framework IOKit -framework Metal -lobjc \
              -framework MetalFX -o obj/metal_caps src/metal_caps.m
          for b in rwsh metal_props metal_dev metal_drv_test metal_caps; do
            if [ -f "obj/$b" ]; then /usr/bin/codesign --force --sign - "obj/$b"; fi
          done
          ls -l obj/
          for f in obj/*; do printf '%s ' "$f"; otool -hv "$f" 2>/dev/null | tail -1; done
      - uses: actions/upload-artifact@v4
        with:
          name: arm64e-progs
          path: /tmp/u/userland/obj/
          if-no-files-found: error

      - name: Leave the programs where a Windows host can fetch them
        # Same reason as build-mesa-air.yml: the artifact API needs a token the
        # build host does not have, codeload does not. A tarball of this orphan
        # branch brings the freshly signed RedwoodMetal bundle home.
        run: |
          set -euo pipefail
          cd /tmp/u/userland/obj
          shasum -a 256 * > SHA256SUMS 2>/dev/null || true
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b metal-artifacts
          git add -A
          git commit -qm "arm64e programs: ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q -f origin metal-artifacts
          echo "metal-artifacts: $(git rev-parse --short HEAD)"

  adhoc-userland:
    # A Windows build host has no codesign. The prebuilt programs of our own are
    # thin arm64 Mach-O files with __LINKEDIT, so macOS can ad hoc sign them and
    # we can copy the signed copies into the local tree. iOS 26 launchd refuses
    # to start a job whose program is not a platform binary; kern_minimac.c takes
    # any ad hoc signed binary for one. This job also builds the installer app,
    # whose build script needs Apple clang and codesign.
    # Nothing in here is an Apple file: the sources and prebuilt programs come
    # from the public hackios-xnu-userland repository.
    # 2026-11-09 drift (fork run 42624407318 failed here): upstream deleted its
    # prebuilt/ tree outright and, in the userland restructure, moved the
    # installer script to src/apps/build_installer.sh and renamed the product
    # to AnnibaleInstaller.app (+ an appinst CLI). The step below follows.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_26.2.app 2>/dev/null || true
          xcodebuild -version
      - name: Fetch userland sources
        run: git clone --depth 1 --branch k90-port https://github.com/iola1999/hackios-xnu-userland.git /tmp/ul
      - name: Ad-hoc sign the prebuilt programs (if upstream ships any)
        run: |
          set -ex
          mkdir -p /tmp/out/signed
          # Upstream ships no prebuilt/userland anymore (see the job comment):
          # sign the prebuilts only if they ever come back, and say so in the
          # log when there is nothing to sign instead of dying on a dead glob.
          if [ -d /tmp/ul/prebuilt/userland ] && [ -n "$(ls -A /tmp/ul/prebuilt/userland 2>/dev/null)" ]; then
            cp /tmp/ul/prebuilt/userland/* /tmp/out/signed/
            for f in /tmp/out/signed/*; do
              magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
              case "$magic" in
                cffaedfe|feedfacf|cefaedfe|bebafeca|cafebabe) ;;
                *) echo "skip (not Mach-O): $(basename "$f")"; continue ;;
              esac
              /usr/bin/codesign --force --sign - "$f"
              printf '%-40s ' "$(basename "$f")"
              /usr/bin/codesign -dv "$f" 2>&1 | grep -i 'flags=' | head -1 || true
            done
          else
            echo "upstream ships no prebuilt/userland anymore; nothing to ad-hoc sign"
            rmdir /tmp/out/signed
          fi
      - name: Build the installer app
        run: |
          set -ex
          mkdir -p /tmp/out
          cd /tmp/ul/userland
          bash src/apps/build_installer.sh
          cp -a obj/AnnibaleInstaller.app /tmp/out/
          cp -a obj/appinst /tmp/out/
          echo "--- AnnibaleInstaller.app ---"
          ls -l /tmp/out/AnnibaleInstaller.app/
          /usr/bin/codesign -dv /tmp/out/AnnibaleInstaller.app/AnnibaleInstaller 2>&1 | head -6
      - uses: actions/upload-artifact@v4
        with:
          name: adhoc-userland
          path: /tmp/out/
          if-no-files-found: error
